name: Public Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  public-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare ShellCheck and Bats
        run: |
          shellcheck --version
          npm install --prefix "$RUNNER_TEMP/bats" --no-audit --no-fund bats@1.10.0
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bats/node_modules/.bin/bats" --version

      - name: Run public quality gate
        run: bash scripts/halo-quality-gate.sh
